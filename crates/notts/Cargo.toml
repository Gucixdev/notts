[package]
name = "notts"
version = "0.1.0"
edition = "2021"
description = "Notification transport: one message, every channel you enabled (phone push, chat, mail, SMS)"
license = "MIT"
rust-version = "1.80"

[lib]
name = "notts"
path = "src/lib.rs"

[[bin]]
name = "notts"
path = "src/main.rs"

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json = "1"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
